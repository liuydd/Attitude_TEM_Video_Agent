services:
  postgres:
    image: postgres:16-alpine
    container_name: pcme-postgres
    ports:
      - "5432:5432"
    environment:
      POSTGRES_DB: pcme
      POSTGRES_USER: pcme
      POSTGRES_PASSWORD: pcme_dev_2024
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U pcme"]
      interval: 5s
      timeout: 3s
      retries: 5

volumes:
  pgdata:
